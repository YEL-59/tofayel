<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Squircle Outer Container -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="3.5"/>

  <!-- Code Bracket Left < -->
  <path d="M 27 42 L 18 50 L 27 58" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Code Bracket Right > -->
  <path d="M 73 42 L 82 50 L 73 58" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Central Tofayel Monogram "T" -->
  <!-- Top Horizontal Bar -->
  <path d="M 33 30 Q 50 32 67 30 C 69.5 30 71 32 71 34.5 C 71 37 69.5 39 67 39 L 33 39 C 30.5 39 29 37 29 34.5 C 29 32 30.5 30 33 30 Z" fill="url(#primaryGrad)" filter="url(#softGlow)"/>
  
  <!-- Vertical Stem -->
  <rect x="44.5" y="36" width="11" height="38" rx="5.5" fill="url(#primaryGrad)" filter="url(#softGlow)"/>

  <!-- Glowing Accent Dot -->
  <circle cx="62" cy="74" r="4.5" fill="#00f2fe" filter="url(#softGlow)"/>
</svg>
